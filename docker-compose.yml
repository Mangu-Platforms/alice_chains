services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-alice_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alice_chains}
      MYSQL_USER: ${MYSQL_USER:-alice}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-alice_pw}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-alice_root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # F-4 object storage. OPTIONAL: the app defaults to STORAGE_DRIVER=local,
  # which writes attachments to the filesystem and needs nothing here. Bring
  # this up only when you want to exercise the S3 path:
  #
  #   docker compose --profile s3 up
  #
  # then set STORAGE_DRIVER=s3 and the S3_* variables in .env.
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Creates the bucket, then exits. Without it the first upload 404s against a
  # bucket that was never made.
  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-alice-attachments} &&
      echo 'bucket ready'
      "
    restart: "no"

  # Applies pending migrations, then exits. The app waits on this completing.
  migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-alice}:${MYSQL_PASSWORD:-alice_pw}@db:3306/${MYSQL_DATABASE:-alice_chains}
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "drizzle-kit", "migrate"]
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-alice}:${MYSQL_PASSWORD:-alice_pw}@db:3306/${MYSQL_DATABASE:-alice_chains}
      VITE_KIMI_AUTH_URL: ${VITE_KIMI_AUTH_URL:?set VITE_KIMI_AUTH_URL in .env}
      VITE_APP_ID: ${VITE_APP_ID:?set VITE_APP_ID in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      OWNER_UNION_ID: ${OWNER_UNION_ID:-}
      # Attachments. Defaults to the filesystem so the stack works with no
      # extra services; switch to s3 with the minio profile above.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-alice-attachments}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    volumes:
      # Local-driver attachments must outlive the container.
      - attachments:/app/storage
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
  minio_data:
  attachments:
